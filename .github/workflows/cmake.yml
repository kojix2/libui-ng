name: Build + Release

on:
  push:
    branches: [main, pre-build, dev, cmake-migration]
    tags: ["commit-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        libtype: [static, shared]
        buildtype: [Release, Debug]
        include:
          - {os: ubuntu-latest, arch: x64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {buildtype: Release, buildlabel: release}
          - {buildtype: Debug, buildlabel: debug}
    runs-on: ${{ matrix.os }}
    name: Ubuntu-${{ matrix.arch }}-${{ matrix.libtype }}-${{ matrix.buildlabel }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcmocka-dev xvfb
      - name: Configure
        run: >-
          cmake -S . -B builddir -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}
          -DBUILD_SHARED_LIBS=${{ matrix.libtype == 'shared' && 'ON' || 'OFF' }}
          -DLIBUI_FETCH_TEST_DEPS=ON
      - name: Build and test
        run: |
          cmake --build builddir --verbose
          xvfb-run ctest --test-dir builddir --output-on-failure
      - name: Test nested consumer
        run: |
          cmake -S test/cmake/consumer -B consumer-add -G Ninja -DLIBUI_SOURCE_MODE=add_subdirectory -DLIBUI_SOURCE_DIR="$PWD" -DBUILD_SHARED_LIBS=${{ matrix.libtype == 'shared' && 'ON' || 'OFF' }}
          cmake --build consumer-add
      - name: Test FetchContent consumer
        if: matrix.arch == 'x64' && matrix.libtype == 'static' && matrix.buildtype == 'Release'
        run: |
          cmake -S test/cmake/consumer -B consumer-fetch -G Ninja -DLIBUI_SOURCE_MODE=fetchcontent -DLIBUI_SOURCE_DIR="$PWD" -DBUILD_SHARED_LIBS=OFF
          cmake --build consumer-fetch
      - name: Test relocated install consumer
        if: matrix.arch == 'x64' && matrix.buildtype == 'Release'
        run: |
          cmake --install builddir --prefix "$RUNNER_TEMP/libui-prefix-one-${{ matrix.libtype }}"
          if grep -R -I -F "$GITHUB_WORKSPACE" "$RUNNER_TEMP/libui-prefix-one-${{ matrix.libtype }}"; then exit 1; fi
          mv "$RUNNER_TEMP/libui-prefix-one-${{ matrix.libtype }}" "$RUNNER_TEMP/libui-prefix-two-${{ matrix.libtype }}"
          cmake -S test/cmake/consumer -B consumer-installed -G Ninja -DLIBUI_SOURCE_MODE=installed -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libui-prefix-two-${{ matrix.libtype }}"
          cmake --build consumer-installed
          ./consumer-installed/consumer
      - name: Package binary SDK
        run: >-
          cpack -G ZIP -C ${{ matrix.buildtype }}
          --config builddir/CPackConfig.cmake -B packages
          -D CPACK_PACKAGE_FILE_NAME=libui-ng-ubuntu-${{ matrix.arch }}-${{ matrix.libtype }}-${{ matrix.buildlabel }}
      - uses: actions/upload-artifact@v7
        with:
          name: libui-ng-ubuntu-${{ matrix.arch }}-${{ matrix.libtype }}-${{ matrix.buildlabel }}
          path: packages/*.zip
          if-no-files-found: error

  cmake-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        libtype: [static, shared]
        buildtype: [Release, Debug]
        include:
          - {buildtype: Release, buildlabel: release}
          - {buildtype: Debug, buildlabel: debug}
    runs-on: windows-latest
    name: Windows-${{ matrix.arch }}-msvc-${{ matrix.libtype }}-${{ matrix.buildlabel }}
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}
      - name: Configure
        shell: pwsh
        run: |
          $shared = '${{ matrix.libtype == 'shared' && 'ON' || 'OFF' }}'
          cmake -S . -B builddir -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} `
            "-DBUILD_SHARED_LIBS:BOOL=$shared" `
            -DLIBUI_FETCH_TEST_DEPS=ON `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          $configured = (Select-String -Path builddir/CMakeCache.txt -Pattern '^BUILD_SHARED_LIBS:BOOL=').Line.Split('=', 2)[1]
          if ($configured -ne $shared) {
            throw "Expected BUILD_SHARED_LIBS=$shared, but CMake configured $configured"
          }
      - name: Build and test
        run: |
          cmake --build builddir --verbose
          ctest --test-dir builddir --output-on-failure --timeout 180
      - name: Visual Studio generator smoke test
        if: matrix.arch == 'x64' && matrix.libtype == 'shared' && matrix.buildtype == 'Release'
        shell: pwsh
        run: |
          # The windows-latest image can advance to a newer Visual Studio release.
          # Let CMake select the installed Visual Studio generator instead of
          # pinning a generator that may no longer exist on the runner.
          cmake -S . -B build-vs -A x64 -DBUILD_SHARED_LIBS=ON -DLIBUI_BUILD_TESTS=OFF -DLIBUI_BUILD_EXAMPLES=OFF
          cmake --build build-vs --config Release
      - name: Package binary SDK
        shell: pwsh
        run: >-
          cpack -G ZIP -C ${{ matrix.buildtype }}
          --config builddir/CPackConfig.cmake -B packages
          -D CPACK_PACKAGE_FILE_NAME=libui-ng-windows-${{ matrix.arch }}-msvc-${{ matrix.libtype }}-${{ matrix.buildlabel }}
      - uses: actions/upload-artifact@v7
        with:
          name: libui-ng-windows-${{ matrix.arch }}-msvc-${{ matrix.libtype }}-${{ matrix.buildlabel }}
          path: packages/*.zip
          if-no-files-found: error

  cmake-msys2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: MINGW64, flavor: mingw, buildtype: Release, buildlabel: release}
          - {system: MINGW64, flavor: mingw, buildtype: Debug, buildlabel: debug}
          - {system: UCRT64, flavor: ucrt, buildtype: Release, buildlabel: release}
          - {system: UCRT64, flavor: ucrt, buildtype: Debug, buildlabel: debug}
    runs-on: windows-latest
    name: Windows-x64-${{ matrix.flavor }}-static-${{ matrix.buildlabel }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: base-devel git
          pacboy: toolchain:p cmake:p ninja:p
          msystem: ${{ matrix.system }}
      - uses: actions/checkout@v6
      - name: Configure, build, and test
        run: |
          cmake -S . -B builddir -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} -DBUILD_SHARED_LIBS=OFF -DLIBUI_FETCH_TEST_DEPS=ON
          cmake --build builddir --verbose
          ctest --test-dir builddir --output-on-failure --timeout 180
          cpack -G ZIP -C ${{ matrix.buildtype }} --config builddir/CPackConfig.cmake -B packages -D CPACK_PACKAGE_FILE_NAME=libui-ng-windows-x64-${{ matrix.flavor }}-static-${{ matrix.buildlabel }}
      - uses: actions/upload-artifact@v7
        with:
          name: libui-ng-windows-x64-${{ matrix.flavor }}-static-${{ matrix.buildlabel }}
          path: packages/*.zip
          if-no-files-found: error

  cmake-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
        libtype: [static, shared]
        buildtype: [Release, Debug]
        include:
          - {os: macos-15-intel, arch: x64, deployment: "10.12"}
          - {os: macos-latest, arch: arm64, deployment: "11.0"}
          - {buildtype: Release, buildlabel: release}
          - {buildtype: Debug, buildlabel: debug}
    runs-on: ${{ matrix.os }}
    name: macOS-${{ matrix.arch }}-${{ matrix.libtype }}-${{ matrix.buildlabel }}
    steps:
      - uses: actions/checkout@v6
      - run: brew install cmake ninja cmocka
      - name: Configure, build, and test
        run: |
          cmake -S . -B builddir -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} -DBUILD_SHARED_LIBS=${{ matrix.libtype == 'shared' && 'ON' || 'OFF' }} -DLIBUI_FETCH_TEST_DEPS=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }}
          cmake --build builddir --verbose
          ctest --test-dir builddir --output-on-failure --timeout 180
          cpack -G ZIP -C ${{ matrix.buildtype }} --config builddir/CPackConfig.cmake -B packages -D CPACK_PACKAGE_FILE_NAME=libui-ng-macos-${{ matrix.arch }}-${{ matrix.libtype }}-${{ matrix.buildlabel }}
      - name: Xcode generator smoke test
        if: matrix.arch == 'arm64' && matrix.libtype == 'shared' && matrix.buildtype == 'Release'
        run: |
          cmake -S . -B build-xcode -G Xcode -DBUILD_SHARED_LIBS=ON -DLIBUI_BUILD_TESTS=OFF -DLIBUI_BUILD_EXAMPLES=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment }}
          cmake --build build-xcode --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: libui-ng-macos-${{ matrix.arch }}-${{ matrix.libtype }}-${{ matrix.buildlabel }}
          path: packages/*.zip
          if-no-files-found: error

  cmake-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.15.x'
      - run: |
          cmake -S . -B build-min -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLIBUI_BUILD_TESTS=OFF -DLIBUI_BUILD_EXAMPLES=OFF
          cmake --build build-min

  portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, alpine]
    steps:
      - uses: actions/checkout@v6
      - name: Build static release in ${{ matrix.distro }}
        run: |
          case '${{ matrix.distro }}' in
            debian)
              image=debian:stable
              install='apt-get update && apt-get install -y cmake ninja-build gcc pkg-config libgtk-3-dev'
              ;;
            fedora)
              image=fedora:latest
              install='dnf -y install cmake ninja-build gcc pkgconf-pkg-config gtk3-devel'
              ;;
            alpine)
              image=alpine:latest
              install='apk add --no-cache cmake ninja gcc musl-dev pkgconf gtk+3.0-dev'
              ;;
          esac
          docker run --rm -v "$PWD:/src:ro" "$image" sh -c "$install && cmake -S /src -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLIBUI_BUILD_TESTS=OFF -DLIBUI_BUILD_EXAMPLES=OFF && cmake --build /tmp/build"

  cmake-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - run: |
          CC=clang cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DLIBUI_BUILD_TESTS=OFF -DLIBUI_BUILD_EXAMPLES=OFF
          cmake --build build-clang

  release:
    needs: [cmake-linux, cmake-windows, cmake-msys2, cmake-macos]
    if: github.ref_type == 'tag' || github.ref_name == 'cmake-migration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Collect CPack ZIP files
        run: |
          mkdir -p zips
          find dist -type f -name '*.zip' -exec cp '{}' zips/ \;
          find zips -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort > actual-release-archives.txt
          diff -u cmake/release-archives.txt actual-release-archives.txt
      - name: Validate release archive contract
        run: |
          for archive in zips/*.zip; do
            name=$(basename "$archive")
            echo "Validating $name"
            entries=$(unzip -Z1 "$archive")
            grep -qx 'include/ui.h' <<<"$entries"
            grep -qx 'lib/cmake/libui-ng/libui-ngConfig.cmake' <<<"$entries"
            grep -qx 'lib/cmake/libui-ng/libui-ngTargets.cmake' <<<"$entries"
            grep -q '^lib/cmake/libui-ng/libui-ngTargets-.*\.cmake$' <<<"$entries"
            grep -qx 'share/doc/libui-ng/LICENSE.md' <<<"$entries"
            if grep -E '(^|/)(builddir|meson-out|meson-logs)(/|$)|\.a\.p/' <<<"$entries"; then
              echo "Legacy build-tree entry found in $name"
              exit 1
            fi
            if unzip -p "$archive" 'lib/cmake/libui-ng/*.cmake' | grep -F "$GITHUB_WORKSPACE"; then
              echo "Source or build path found in CMake package metadata in $name"
              exit 1
            fi
            case "$name" in
              libui-ng-ubuntu-*) grep -qx 'include/ui_unix.h' <<<"$entries" ;;
              libui-ng-macos-*) grep -qx 'include/ui_darwin.h' <<<"$entries" ;;
              libui-ng-windows-*) grep -qx 'include/ui_windows.h' <<<"$entries" ;;
              *) echo "Unexpected release asset: $name"; exit 1 ;;
            esac
            case "$name" in
              libui-ng-windows-*-msvc-static-*) grep -qx 'lib/libui.lib' <<<"$entries" ;;
              *-static-*) grep -qx 'lib/libui.a' <<<"$entries" ;;
              libui-ng-ubuntu-*-shared-*) grep -qx 'lib/libui.so' <<<"$entries" ;;
              libui-ng-macos-*-shared-*) grep -qx 'lib/libui.dylib' <<<"$entries" ;;
              libui-ng-windows-*-msvc-shared-*)
                grep -qx 'bin/libui.dll' <<<"$entries"
                grep -qx 'lib/ui.lib' <<<"$entries"
                ;;
              *) echo "Unexpected linkage in release asset: $name"; exit 1 ;;
            esac
            if [[ "$name" == libui-ng-windows-*-msvc-static-debug.zip ]]; then
              grep -qx 'lib/libui.pdb' <<<"$entries"
            elif [[ "$name" == libui-ng-windows-*-msvc-shared-debug.zip ]]; then
              grep -qx 'bin/libui.pdb' <<<"$entries"
              grep -qx 'lib/libui.pdb' <<<"$entries"
            fi
          done
      - name: Validate relocated CMake and direct C consumers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build gcc libgtk-3-dev
          mkdir /tmp/libui-prefix-one
          unzip -q zips/libui-ng-ubuntu-x64-static-release.zip -d /tmp/libui-prefix-one
          mv /tmp/libui-prefix-one /tmp/libui-prefix-two
          cmake -S test/cmake/consumer -B /tmp/libui-consumer -G Ninja -DLIBUI_SOURCE_MODE=installed -DCMAKE_PREFIX_PATH=/tmp/libui-prefix-two
          cmake --build /tmp/libui-consumer
          /tmp/libui-consumer/consumer
          cc test/cmake/consumer/main.c test/cmake/consumer/extension.c -I/tmp/libui-prefix-two/include /tmp/libui-prefix-two/lib/libui.a $(pkg-config --cflags --libs gtk+-3.0) -lm -ldl -o /tmp/libui-direct-consumer
          /tmp/libui-direct-consumer
      - uses: crystal-lang/install-crystal@v1
      - name: Validate Crystal and Ruby consumers
        run: |
          mkdir /tmp/libui-shared-prefix-one
          unzip -q zips/libui-ng-ubuntu-x64-shared-release.zip -d /tmp/libui-shared-prefix-one
          mv /tmp/libui-shared-prefix-one /tmp/libui-shared-prefix-two
          CRYSTAL_CACHE_DIR=/tmp/crystal-cache crystal build test/bindings/crystal_smoke.cr -o /tmp/libui-crystal-static --link-flags "/tmp/libui-prefix-two/lib/libui.a $(pkg-config --libs gtk+-3.0) -lm -ldl"
          /tmp/libui-crystal-static
          cc test/cmake/consumer/main.c test/cmake/consumer/extension.c -I/tmp/libui-shared-prefix-two/include -L/tmp/libui-shared-prefix-two/lib -lui $(pkg-config --cflags --libs gtk+-3.0) -Wl,-rpath,/tmp/libui-shared-prefix-two/lib -o /tmp/libui-direct-shared
          /tmp/libui-direct-shared
          CRYSTAL_CACHE_DIR=/tmp/crystal-cache crystal build test/bindings/crystal_smoke.cr -o /tmp/libui-crystal-shared --link-flags "-L/tmp/libui-shared-prefix-two/lib -lui"
          LD_LIBRARY_PATH=/tmp/libui-shared-prefix-two/lib /tmp/libui-crystal-shared
          ruby test/bindings/ruby_fiddle_smoke.rb /tmp/libui-shared-prefix-two/lib/libui.so
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'experimental') }}
          files: zips/*.zip
